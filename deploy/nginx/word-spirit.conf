# ============================================================
# 词灵学园 前端 + Nginx 反向代理配置
# 用法：上传到服务器 /etc/nginx/conf.d/word-spirit.conf
#       修改 root 为你的 dist 实际目录后：nginx -t && nginx -s reload
# 架构：浏览器 → Nginx(:80) ─┬─ 静态文件（前端 dist）
#                            └─ /api、/uploads → SpringBoot(:8080)
# 好处：前端请求全部同源，后端 CORS 白名单无需任何改动
# ============================================================

server {
    listen       80;
    server_name  45.192.104.52;          # 以后有域名就替换成域名，如 www.cilingxueyuan.com

    # ↓↓↓ 改成你服务器上前端 dist 目录的实际路径 ↓↓↓
    root   /www/www/ciling/dist;
    index  index.html;

    # 上传大小上限（后端限制单文件 5MB，留一点余量）
    client_max_body_size 6m;

    # ---------- gzip：文本类压缩率 70%~85%，首屏显著提速 ----------
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # ---------- SPA history 路由：刷新不 404 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物：长缓存（文件名变了缓存自然失效）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存：发版后用户立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------- 后端接口反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 分析类接口后端最长 45s，留余量到 75s，避免慢请求被 nginx 掐断
        proxy_read_timeout 75s;
        # API 响应永不缓存：避免浏览器把接口响应存盘后返回假 200（本次验证码事故的根源）
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 本地存储文件（未配 OSS 时头像等回退 uploads/ 目录，由后端提供）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
    }
}
